<div class="stage" id="stage" data-mode="1">
  <canvas id="stars"></canvas>
  <div class="grid"></div>
  <div class="fog f1"></div><div class="fog f2"></div><div class="fog f3"></div>
  <div class="pointer"></div>
  <div class="shell" id="shell">
    <div class="scan"></div>
    <div class="badge">SYSTEM // LIVE EMBED TEST</div>
    <div class="content">
      <div class="eyebrow">REACTIVE INTERFACE</div>
      <h1 class="title"><span>VOID</span><span class="chrome">BLOOM</span></h1>
      <p class="sub" id="sub">Move your cursor. Ignite the core. Cycle the spectrum. Everything here is live HTML, CSS and JavaScript.</p>
      <div class="actions"><button class="btn" id="ignite">IGNITE</button><button class="btn" id="shift">SHIFT MODE</button><span class="hint">mouse / touch reactive</span></div>
    </div>
    <div class="coreWrap"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div>
    <div class="shock"></div>
    <div class="status"><span class="dot"></span><span id="state">STABLE</span></div>
    <div class="meter"></div>
  </div>
</div>
