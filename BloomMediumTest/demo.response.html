<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOID//BLOOM</title>
<style>
:root{--mx:50%;--my:50%;--pulse:0;--bg:#06070b;--panel:rgba(13,15,23,.58);--line:rgba(255,255,255,.12);--text:#f7f8ff;--muted:#8f94a8;--a:#7b5cff;--b:#00e5ff;--c:#ff3ea5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{min-height:100vh}.stage{position:relative;width:100%;height:100vh;min-height:400px;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 45%,#14152b 0%,#090a12 38%,#05060a 72%,#020204 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-5}.grid{position:absolute;inset:-10%;z-index:-4;opacity:.45;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);background-size:42px 42px;transform:perspective(700px) rotateX(66deg) translateY(34%);mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 70%)}.fog{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(95px);mix-blend-mode:screen;opacity:.17;z-index:-3;animation:drift 12s ease-in-out infinite alternate}.f1{left:-28vmax;top:-34vmax;background:#6c46ff}.f2{right:-28vmax;bottom:-42vmax;background:#00d4ff;animation-delay:-4s}.f3{left:35%;top:20%;width:40vmax;height:40vmax;background:#ff2d9a;opacity:.09;animation-delay:-7s}@keyframes drift{to{transform:translate3d(7vmax,4vmax,0) scale(1.17)}}.pointer{position:absolute;width:320px;height:320px;border-radius:50%;pointer-events:none;z-index:-2;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(61,224,255,.14),rgba(113,74,255,.07) 40%,transparent 72%);filter:blur(8px);left:var(--mx);top:var(--my);transition:opacity .25s}.shell{position:relative;width:min(930px,92vw);height:min(340px,84vh);min-height:300px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));box-shadow:0 40px 100px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.17),0 0 110px rgba(91,68,255,.12);backdrop-filter:blur(22px);overflow:hidden;transform-style:preserve-3d;transition:transform .18s ease-out,box-shadow .5s ease}.shell:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.13),transparent 27%);pointer-events:none}.scan{position:absolute;left:-20%;top:-10%;width:34%;height:130%;transform:skewX(-16deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.02),rgba(255,255,255,.42),rgba(255,255,255,.02),transparent);filter:blur(7px);animation:sweep 4.6s cubic-bezier(.55,.06,.26,.98) infinite}@keyframes sweep{0%,55%{left:-40%}88%,100%{left:125%}}.content{position:absolute;inset:0;padding:34px 42px;display:flex;flex-direction:column;justify-content:center;z-index:2}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.34em;color:#a5f5ff;opacity:.72;margin-bottom:13px}.title{margin:0;font-size:clamp(48px,8vw,86px);line-height:.82;letter-spacing:-.075em;font-weight:900;text-transform:uppercase}.title span{display:block}.title .chrome{background:linear-gradient(90deg,#fff 0%,#80f4ff 24%,#9472ff 49%,#ff62c8 73%,#fff 100%);background-size:260% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:flow 3s linear infinite;filter:drop-shadow(0 0 14px rgba(84,225,255,.22))}@keyframes flow{to{background-position:260% center}}.sub{margin:18px 0 24px;color:var(--muted);font-size:13px;max-width:430px;line-height:1.6}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.btn{position:relative;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.055);color:#fff;border-radius:999px;padding:12px 22px;font-size:10px;font-weight:850;letter-spacing:.22em;cursor:pointer;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 30px rgba(0,0,0,.26);transition:.2s ease}.btn:hover{transform:translateY(-2px) scale(1.035);box-shadow:0 0 26px rgba(87,226,255,.18),inset 0 1px 0 rgba(255,255,255,.18)}.btn:after{content:"";position:absolute;inset:-1px;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.58),transparent 75%);transform:translateX(-140%)}.btn:hover:after{animation:btnshine .7s ease}@keyframes btnshine{to{transform:translateX(140%)}}.hint{font-size:10px;color:#7e8497;letter-spacing:.14em}.coreWrap{position:absolute;right:70px;top:50%;width:200px;height:200px;transform:translateY(-50%);display:grid;place-items:center;z-index:3;filter:drop-shadow(0 0 24px rgba(96,223,255,.12))}.core{position:relative;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 7%,#bffcff 8%,#62eaff 23%,#7d53ff 54%,#24062e 100%);box-shadow:0 0 12px #fff,0 0 32px #59ecff,0 0 70px #704cff,0 0 120px rgba(255,55,172,.42);animation:pulse 2.8s ease-in-out infinite}.core:after{content:"";position:absolute;inset:31px;border-radius:50%;background:#fff;box-shadow:0 0 20px #fff,0 0 42px #57f1ff}.ring{position:absolute;border:1px solid rgba(184,246,255,.4);border-radius:50%;box-shadow:0 0 16px rgba(93,227,255,.09)}.r1{width:126px;height:126px;animation:spin 5.5s linear infinite}.r2{width:160px;height:86px;transform:rotate(34deg);animation:spin2 7.2s linear infinite}.r3{width:95px;height:175px;transform:rotate(-42deg);animation:spin 6.4s linear infinite}.ring:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;left:50%;top:-4px;box-shadow:0 0 9px #fff,0 0 18px #68eaff}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spin2{to{transform:rotate(-326deg)}}@keyframes pulse{50%{transform:scale(1.06);filter:hue-rotate(18deg)}}.status{position:absolute;right:22px;bottom:18px;font-size:9px;letter-spacing:.2em;color:#758095;display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;border-radius:50%;background:#65f6c4;box-shadow:0 0 12px #65f6c4;animation:blink 1.4s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}.shock{position:absolute;inset:50% auto auto 50%;width:10px;height:10px;border-radius:50%;border:1px solid rgba(126,240,255,.7);transform:translate(-50%,-50%);opacity:0;pointer-events:none}.stage.awake .shock{animation:shock 1.1s ease-out 3}.stage.awake .core{animation:pulse .68s ease-in-out infinite,chromeshift 1.2s linear infinite}.stage.awake .shell{box-shadow:0 40px 100px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.2),0 0 120px rgba(64,226,255,.25),0 0 190px rgba(165,62,255,.14)}.stage.awake .grid{animation:gridflash .9s ease-out}@keyframes shock{0%{width:10px;height:10px;opacity:.9}100%{width:650px;height:650px;opacity:0}}@keyframes chromeshift{to{filter:hue-rotate(360deg)}}@keyframes gridflash{50%{opacity:.82}}.stage[data-mode="2"]{--a:#ff4d8d;--b:#ffd35c;--c:#ff5a36}.stage[data-mode="2"] .chrome{background-image:linear-gradient(90deg,#fff,#ffe86f,#ff4d8d,#ff7b2e,#fff)}.stage[data-mode="2"] .core{filter:hue-rotate(115deg)}.stage[data-mode="3"]{--a:#73ffbd;--b:#62d7ff;--c:#b6ff58}.stage[data-mode="3"] .chrome{background-image:linear-gradient(90deg,#fff,#73ffbd,#62d7ff,#b6ff58,#fff)}.stage[data-mode="3"] .core{filter:hue-rotate(240deg)}.badge{position:absolute;left:20px;top:18px;font-size:9px;letter-spacing:.22em;color:#778096;z-index:3}.meter{position:absolute;left:20px;right:20px;bottom:0;height:2px;background:rgba(255,255,255,.06);z-index:4;overflow:hidden}.meter:after{content:"";display:block;height:100%;width:var(--p,18%);background:linear-gradient(90deg,#6d5cff,#52e7ff,#ff58c8);box-shadow:0 0 12px rgba(89,229,255,.5);transition:width .6s cubic-bezier(.22,.8,.22,1)}
@media(max-width:720px){.shell{height:330px}.content{padding:30px 28px}.coreWrap{right:18px;top:74px;transform:scale(.62)}.title{font-size:52px}.sub{max-width:63%;font-size:12px}.status{display:none}.hint{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage" data-mode="1">
<canvas id="stars"></canvas><div class="grid"></div><div class="fog f1"></div><div class="fog f2"></div><div class="fog f3"></div><div class="pointer"></div>
<div class="shell" id="shell"><div class="scan"></div><div class="badge">SYSTEM // LIVE EMBED TEST</div><div class="content"><div class="eyebrow">REACTIVE INTERFACE</div><h1 class="title"><span>VOID</span><span class="chrome">BLOOM</span></h1><p class="sub" id="sub">Move your cursor. Ignite the core. Cycle the spectrum. Everything here is live HTML, CSS and JavaScript.</p><div class="actions"><button class="btn" id="ignite">IGNITE</button><button class="btn" id="shift">SHIFT MODE</button><span class="hint">mouse / touch reactive</span></div></div><div class="coreWrap"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div><div class="shock"></div><div class="status"><span class="dot"></span><span id="state">STABLE</span></div><div class="meter"></div></div>
</div>
<script>
const stage=document.getElementById('stage'),shell=document.getElementById('shell'),ignite=document.getElementById('ignite'),shift=document.getElementById('shift'),state=document.getElementById('state'),sub=document.getElementById('sub');
let mode=1,awake=false,progress=18;
function aim(x,y){const r=stage.getBoundingClientRect(),px=(x-r.left)/r.width,py=(y-r.top)/r.height;stage.style.setProperty('--mx',px*100+'%');stage.style.setProperty('--my',py*100+'%');shell.style.transform=`perspective(950px) rotateX(${(0.5-py)*8}deg) rotateY(${(px-.5)*12}deg)`}
stage.addEventListener('mousemove',e=>aim(e.clientX,e.clientY));stage.addEventListener('mouseleave',()=>shell.style.transform='perspective(950px) rotateX(0) rotateY(0)');stage.addEventListener('touchmove',e=>{const t=e.touches[0];if(t)aim(t.clientX,t.clientY)},{passive:true});
ignite.addEventListener('click',()=>{awake=!awake;stage.classList.toggle('awake',awake);ignite.textContent=awake?'STABILIZE':'IGNITE';state.textContent=awake?'OVERDRIVE':'STABLE';sub.textContent=awake?'Core output unlocked. Reactive bloom, spectral drift and pulse synchronization are active.':'Move your cursor. Ignite the core. Cycle the spectrum. Everything here is live HTML, CSS and JavaScript.';progress=awake?86:18;shell.style.setProperty('--p',progress+'%')});
shift.addEventListener('click',()=>{mode=mode%3+1;stage.dataset.mode=mode;progress=mode===1?34:mode===2?61:78;shell.style.setProperty('--p',progress+'%');state.textContent=['','VIOLET','SOLAR','BIO-LUME'][mode]});
const c=document.getElementById('stars'),ctx=c.getContext('2d');let W,H,DPR,stars=[];function resize(){DPR=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:Math.floor(W*H/8500)},()=>({x:Math.random()*W,y:Math.random()*H,z:.2+Math.random()*.8,r:.35+Math.random()*1.3,p:Math.random()*Math.PI*2}))}function draw(t){ctx.clearRect(0,0,W,H);for(const s of stars){s.p+=.01+s.z*.012;s.y+=.025+s.z*.05;if(s.y>H+3)s.y=-3;const a=.18+(.5+.5*Math.sin(s.p))*.72;ctx.beginPath();ctx.arc(s.x,s.y,s.r*(.7+s.z*.6),0,Math.PI*2);ctx.fillStyle=`rgba(230,246,255,${a})`;ctx.shadowBlur=8*s.z;ctx.shadowColor='rgba(127,222,255,.8)';ctx.fill()}ctx.shadowBlur=0;requestAnimationFrame(draw)}addEventListener('resize',resize);resize();requestAnimationFrame(draw);shell.style.setProperty('--p','18%');
</script>
</body>
</html>
