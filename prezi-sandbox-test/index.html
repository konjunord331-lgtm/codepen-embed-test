<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prezi Sandbox Test</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#08090d;font-family:Arial,sans-serif;color:#fff}
body{display:grid;place-items:center}
.stage{position:relative;width:min(92vw,900px);height:420px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#321044 0,#130a1d 38%,#08090d 75%);box-shadow:0 0 70px rgba(201,77,255,.28) inset}
.orb{position:absolute;width:160px;height:160px;border-radius:50%;filter:blur(2px);background:radial-gradient(circle at 35% 30%,#fff 0 4%,#ef9cff 8%,#a42cff 35%,transparent 68%);animation:orbit 5s linear infinite}
.orb.two{width:100px;height:100px;animation-duration:7s;animation-direction:reverse;opacity:.7}
.title{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:clamp(34px,7vw,82px);letter-spacing:.08em;text-shadow:0 0 12px #fff,0 0 28px #cf5cff,0 0 70px #7612ff;animation:pulse 1.8s ease-in-out infinite alternate}
.sub{position:absolute;left:0;right:0;bottom:48px;text-align:center;font-size:14px;letter-spacing:.35em;opacity:.68}
.spark{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 10px 3px #c95cff;animation:fall 3s linear infinite}
@keyframes orbit{0%{transform:translate(-70px,-40px)}25%{transform:translate(720px,30px)}50%{transform:translate(600px,260px)}75%{transform:translate(40px,220px)}100%{transform:translate(-70px,-40px)}}
@keyframes pulse{from{transform:scale(.98);filter:brightness(.9)}to{transform:scale(1.035);filter:brightness(1.2)}}
@keyframes fall{from{transform:translateY(-30px) translateX(0);opacity:0}15%{opacity:1}to{transform:translateY(470px) translateX(120px);opacity:0}}
</style>
</head>
<body>
<div class="stage">
  <div class="orb"></div><div class="orb two"></div>
  <div class="title">SHEDONTLUV-U</div>
  <div class="sub">PREZI SANDBOX TEST</div>
  <i class="spark" style="left:12%;animation-delay:.2s"></i><i class="spark" style="left:27%;animation-delay:1.1s"></i><i class="spark" style="left:48%;animation-delay:.6s"></i><i class="spark" style="left:69%;animation-delay:1.7s"></i><i class="spark" style="left:86%;animation-delay:.9s"></i>
</div>
</body>
</html>
