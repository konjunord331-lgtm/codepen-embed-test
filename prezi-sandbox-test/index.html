<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Sandbox Test</title>
<style>
html,body{margin:0;height:100%;background:#08090d;font-family:Arial,sans-serif;color:#fff;overflow:hidden}body{display:grid;place-items:center}.stage{width:min(92vw,900px);height:420px;border-radius:26px;background:radial-gradient(circle at 50% 42%,#321044 0,#130a1d 38%,#08090d 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}.title{font-weight:900;font-size:clamp(34px,7vw,72px);letter-spacing:.08em;text-shadow:0 0 12px #fff,0 0 28px #cf5cff}.orb{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 4%,#ef9cff 8%,#a42cff 38%,#3a085d 70%);box-shadow:0 0 30px #a42cff;transition:.25s}.orb.active{transform:scale(1.35) rotate(20deg);filter:hue-rotate(80deg);box-shadow:0 0 55px #55ffd6}.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}button{font:700 15px Arial;padding:12px 18px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff12;color:white;cursor:pointer}button:active{transform:scale(.96)}.status{font-size:14px;opacity:.8}
</style>
</head>
<body>
<div class="stage">
<div class="title">SHEDONTLUV-U</div>
<div class="orb" id="orb"></div>
<div class="controls"><button id="toggle">TOGGLE CORE</button><button id="count">CLICK TEST</button><button id="reset">RESET</button></div>
<div class="status" id="status">Clicks: 0 · Core OFF</div>
</div>
<script>
const orb=document.getElementById('orb');const status=document.getElementById('status');let clicks=0;let active=false;function draw(){status.textContent='Clicks: '+clicks+' · Core '+(active?'ON':'OFF')}document.getElementById('toggle').addEventListener('click',function(){active=!active;clicks++;orb.classList.toggle('active',active);draw()});document.getElementById('count').addEventListener('click',function(){clicks++;draw()});document.getElementById('reset').addEventListener('click',function(){clicks=0;active=false;orb.classList.remove('active');draw()});
</script>
</body>
</html>
