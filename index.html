<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Title Studio</title>
  <style>
    html,body{margin:0;min-height:100%;background:#050506;color:#f5f2ee;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{display:grid;place-items:center;min-height:100vh;overflow:hidden}
    .wrap{text-align:center;padding:24px}
    .eyebrow{font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:#a79ca0;margin-bottom:14px}
    h1{margin:0;font-size:clamp(48px,12vw,140px);line-height:.9;letter-spacing:.04em;background:linear-gradient(180deg,#fff8f3,#b86b79 55%,#42111d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(128,0,34,.28))}
    p{margin:18px 0 0;color:#b8adb1;font-size:14px;letter-spacing:.08em}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">GitHub Pages is working</div>
    <h1>TITLE STUDIO</h1>
    <p>WebGL motion lab — ready for the first cinematic title.</p>
  </main>
</body>
</html>
