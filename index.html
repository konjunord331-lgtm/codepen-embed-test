<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SOCIAL — Title Studio</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#020203;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:
    radial-gradient(circle at 50% 48%,#19040b 0,#070306 30%,#010102 72%)}
  .shell{width:100%;display:grid;place-items:center;gap:14px;padding:12px}
  .frame{position:relative;width:min(100vw,1800px);aspect-ratio:4/1;overflow:hidden;background:#020203;box-shadow:0 0 80px #000,0 0 120px rgba(112,0,31,.18);isolation:isolate}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .grain{position:absolute;inset:-40%;z-index:5;pointer-events:none;opacity:.12;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");animation:grain .22s steps(2) infinite}
  .vignette{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.1) 60%,rgba(0,0,0,.82) 100%)}
  .scan{position:absolute;z-index:6;pointer-events:none;top:-40%;left:-28%;width:18%;height:180%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,224,210,.02),rgba(255,240,230,.23),rgba(255,255,255,.03),transparent);filter:blur(7px);animation:scan 7s cubic-bezier(.18,.62,.2,1) infinite}
  .hud{position:absolute;z-index:7;inset:0;pointer-events:none}
  .hud:before,.hud:after{content:"";position:absolute;top:50%;width:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,213,201,.35),rgba(145,0,40,.55));opacity:.55}
  .hud:before{left:1%}.hud:after{right:1%;transform:scaleX(-1)}
  .meta{position:absolute;z-index:8;inset:auto 0 7%;text-align:center;pointer-events:none;font-size:clamp(7px,.75vw,12px);letter-spacing:.38em;color:rgba(255,222,212,.6);text-transform:uppercase;text-shadow:0 0 15px rgba(184,0,47,.25)}
  .controls{display:flex;gap:9px;z-index:20}
  button{border:1px solid rgba(255,255,255,.14);background:#0d0b0d;color:#e9dfe2;border-radius:999px;padding:9px 14px;font:600 11px/1 Inter,system-ui;letter-spacing:.08em}
  .hint{font-size:10px;letter-spacing:.12em;color:#766d72;text-transform:uppercase;text-align:center}
  @keyframes grain{0%{transform:translate(0)}25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(1%,2%)}100%{transform:translate(-2%,-1%)}}
  @keyframes scan{0%,15%{left:-28%;opacity:0}20%{opacity:.8}58%{opacity:.65}72%,100%{left:115%;opacity:0}}
  @media (orientation:landscape){.shell{padding:0}.frame{width:min(100vw,1800px)}.hint{display:none}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="shell">
  <section class="frame" id="frame">
    <div class="grain"></div><div class="vignette"></div><div class="scan"></div><div class="hud"></div>
    <div class="meta">PART III · ASSOCIATION · PROXIMITY · PERCEPTION</div>
  </section>
  <div class="controls"><button id="replay">REPLAY</button><button id="full">FULLSCREEN</button></div>
  <div class="hint">rotate your phone for the full cinematic banner</div>
</div>
<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const frame=document.getElementById('frame');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
frame.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020203);
scene.fog=new THREE.FogExp2(0x090207,.022);
const camera=new THREE.PerspectiveCamera(34,4,0.1,100);
camera.position.set(0,.12,12.2);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(1200,300),1.15,.72,.14);
composer.addPass(bloom);

// procedural eclipse / nebula backdrop
const bgMat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0},uAspect:{value:4}},depthWrite:false,depthTest:false,
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
  precision highp float; varying vec2 vUv; uniform float uTime; uniform float uAspect;
  float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
  float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
  void main(){
    vec2 p=vUv-.5; p.x*=uAspect;
    float r=length(p*vec2(.72,1.0));
    float n=noise(p*3.1+uTime*.035)+.5*noise(p*7.0-uTime*.02);
    float core=smoothstep(.78,.12,r);
    float halo=exp(-abs(r-.67)*9.0);
    float ring=exp(-abs(r-.47)*48.0);
    float rays=pow(max(0.,sin(atan(p.y,p.x)*15.0+uTime*.35)),12.0)*exp(-r*1.8);
    vec3 c=vec3(.003,.002,.004);
    c+=vec3(.14,.004,.035)*core*(.28+n*.35);
    c+=vec3(.42,.018,.075)*halo*(.18+.18*sin(uTime*.65));
    c+=vec3(.95,.38,.28)*ring*.16;
    c+=vec3(.32,.012,.055)*rays*.18;
    float eclipse=smoothstep(.49,.46,r)*smoothstep(.30,.34,r);
    c+=vec3(.45,.035,.09)*eclipse*.14;
    c*=1.0-smoothstep(1.45,2.1,r)*.8;
    gl_FragColor=vec4(c,1.0);
  }`});
const bg=new THREE.Mesh(new THREE.PlaneGeometry(38,9.5),bgMat);bg.position.z=-5.5;scene.add(bg);

// concentric luminous rings
const ringGroup=new THREE.Group();scene.add(ringGroup);
for(let i=0;i<6;i++){
  const geo=new THREE.TorusGeometry(2.35+i*.43,.012+(i%2)*.004,8,180);
  const mat=new THREE.MeshBasicMaterial({color:i<2?0xff7c73:0x79001f,transparent:true,opacity:.25/(1+i*.22),blending:THREE.AdditiveBlending,depthWrite:false});
  const m=new THREE.Mesh(geo,mat);m.scale.y=.42;m.rotation.z=(i-2.5)*.028;m.position.z=-1.1-i*.06;ringGroup.add(m);
}

// star/ember field
const N=1800;const pos=new Float32Array(N*3);const col=new Float32Array(N*3);
for(let i=0;i<N;i++){
  const a=Math.random()*Math.PI*2,r=2.8+Math.pow(Math.random(),.65)*12;
  pos[i*3]=Math.cos(a)*r*1.9; pos[i*3+1]=Math.sin(a)*r*.52; pos[i*3+2]=-1.5-Math.random()*6;
  const hot=Math.random()>.84; col[i*3]=hot?1:.45; col[i*3+1]=hot?.38:.05; col[i*3+2]=hot?.32:.12;
}
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));pGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
const pMat=new THREE.PointsMaterial({size:.025,vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});
const points=new THREE.Points(pGeo,pMat);scene.add(points);

// light blades crossing behind the title
const bladeMat=new THREE.MeshBasicMaterial({color:0xffd1c5,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const bladeGeo=new THREE.PlaneGeometry(13,.018);
const bladeA=new THREE.Mesh(bladeGeo,bladeMat.clone());bladeA.position.set(-1.3,.15,-.55);bladeA.rotation.z=.015;scene.add(bladeA);
const bladeB=new THREE.Mesh(bladeGeo,bladeMat.clone());bladeB.position.set(1.2,-.08,-.6);bladeB.rotation.z=-.012;scene.add(bladeB);

// shockwave ring used during the loop
const shock=new THREE.Mesh(new THREE.RingGeometry(1.45,1.49,160),new THREE.MeshBasicMaterial({color:0xff9a8f,transparent:true,opacity:0,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));
shock.scale.y=.38;shock.position.z=-.22;scene.add(shock);

// lights
scene.add(new THREE.AmbientLight(0x260913,1.1));
const key=new THREE.PointLight(0xffd8c8,38,30,1.65);key.position.set(-5,3,5.5);scene.add(key);
const red=new THREE.PointLight(0xb00034,55,28,1.7);red.position.set(4,-1.6,4);scene.add(red);
const rim=new THREE.PointLight(0xff5d68,35,24,1.5);rim.position.set(0,2,-.2);scene.add(rim);

let titleGroup=new THREE.Group();scene.add(titleGroup);
const loader=new FontLoader();
loader.load('https://cdn.jsdelivr.net/npm/three@0.185.1/examples/fonts/helvetiker_bold.typeface.json',font=>{
  const geo=new TextGeometry('SOCIAL',{font,size:2.35,depth:.42,curveSegments:10,bevelEnabled:true,bevelThickness:.07,bevelSize:.045,bevelOffset:0,bevelSegments:5});
  geo.computeBoundingBox(); const box=geo.boundingBox; const w=box.max.x-box.min.x; geo.translate(-w/2,-1.05,0);
  const metal=new THREE.MeshPhysicalMaterial({color:0x4a0718,metalness:.96,roughness:.17,clearcoat:1,clearcoatRoughness:.11,reflectivity:1,ior:1.48,emissive:0x160009,emissiveIntensity:.34});
  const text=new THREE.Mesh(geo,metal);text.castShadow=false;titleGroup.add(text);
  const edge=new THREE.Mesh(geo.clone(),new THREE.MeshBasicMaterial({color:0xffc7b9,wireframe:true,transparent:true,opacity:.055,blending:THREE.AdditiveBlending,depthWrite:false}));edge.scale.set(1.006,1.012,1.012);edge.position.z=.015;titleGroup.add(edge);
  const ghost=new THREE.Mesh(geo.clone(),new THREE.MeshBasicMaterial({color:0x810021,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false}));ghost.position.set(.09,-.07,-.24);ghost.scale.set(1.015,1.015,1.0);titleGroup.add(ghost);
});

const clock=new THREE.Clock(); let timeOffset=0; const LOOP=7;
function easeOutCubic(x){return 1-Math.pow(1-x,3)}
function animate(){
  const elapsed=clock.getElapsedTime()+timeOffset; const t=(elapsed%LOOP)/LOOP; const a=elapsed;
  bgMat.uniforms.uTime.value=a;
  points.rotation.z=a*.012;points.rotation.y=Math.sin(a*.18)*.015;
  ringGroup.rotation.z=Math.sin(a*.22)*.018; ringGroup.scale.setScalar(1+.025*Math.sin(a*.72));
  key.position.x=-5+Math.sin(a*.74)*3.5; key.position.y=2.5+Math.cos(a*.56)*1.2;
  red.position.x=4+Math.cos(a*.62)*4.4; red.intensity=48+20*(.5+.5*Math.sin(a*1.15));
  rim.intensity=26+18*(.5+.5*Math.sin(a*.82+1.4));
  titleGroup.rotation.y=Math.sin(a*.55)*.018; titleGroup.rotation.x=Math.cos(a*.47)*.009;
  const breathe=1+.012*Math.sin(a*.82);titleGroup.scale.set(breathe,breathe,breathe);
  const intro=Math.min(1,t/.12);titleGroup.position.z=-1.0+easeOutCubic(intro)*1.0;
  titleGroup.position.y=.05+.035*Math.sin(a*.65);
  const phase=(t-.40)/.20;
  if(phase>=0&&phase<=1){shock.visible=true;shock.material.opacity=Math.sin(phase*Math.PI)*.36;const s=.75+phase*4.6;shock.scale.set(s,s*.38,s);}else{shock.material.opacity=0;}
  bladeA.material.opacity=.08+.16*Math.max(0,Math.sin((t*.95+.12)*Math.PI*2));
  bladeB.material.opacity=.06+.12*Math.max(0,Math.sin((t*.8+.5)*Math.PI*2));
  bloom.strength=1.0+.34*Math.sin(a*.72)*.5+.34;
  camera.position.x=Math.sin(a*.23)*.08;camera.position.y=.12+Math.cos(a*.26)*.035;camera.lookAt(0,0,0);
  composer.render(); requestAnimationFrame(animate);
}
function resize(){const r=frame.getBoundingClientRect();renderer.setSize(r.width,r.height,false);composer.setSize(r.width,r.height);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();bgMat.uniforms.uAspect.value=r.width/r.height;}
new ResizeObserver(resize).observe(frame);resize();animate();

document.getElementById('replay').onclick=()=>{timeOffset=LOOP-(clock.getElapsedTime()%LOOP)};
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)frame.requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener('fullscreenchange',resize);
</script>
</body>
</html>
